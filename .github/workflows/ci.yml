name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - refactor/typescript-modernization

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Quality gate
        run: npm run check
